function Button({ href, variant = "red", children }) {
  const styles = {
    red: "bg-crimson text-white shadow-[0_0_28px_rgba(224,40,63,.45)] hover:shadow-[0_0_44px_rgba(224,40,63,.75)]",
    glass: "glass text-foam hover:bg-white/10",
    blurple: "bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-[0_0_30px_rgba(124,92,255,.5)] hover:shadow-[0_0_50px_rgba(124,92,255,.85)]"
  };
  return html`<a href=${href} ...${ext} class=${"btn inline-flex items-center justify-center gap-2 rounded-full px-7 py-3.5 font-semibold tracking-wide " + styles[variant]}>${children}</a>`;
}

function Particles() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let w, h, raf, ps = [];
    const size = () => { w = c.width = c.offsetWidth; h = c.height = c.offsetHeight; };
    size(); addEventListener("resize", size);
    const make = () => ({ x: Math.random() * w, y: h + Math.random() * h, r: Math.random() * 1.8 + .4, v: Math.random() * .5 + .15, d: Math.random() * 2 * Math.PI, ember: Math.random() < .35 });
    for (let i = 0; i < 70; i++) { const p = make(); p.y = Math.random() * h; ps.push(p); }
    const tick = () => {
      ctx.clearRect(0, 0, w, h);
      ps.forEach((p, i) => {
        p.y -= p.v; p.d += .01; p.x += Math.sin(p.d) * .35;
        if (p.y < -10) ps[i] = make();
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
        ctx.fillStyle = p.ember ? "rgba(255,90,110,.75)" : "rgba(180,220,255,.5)";
        ctx.shadowBlur = 10; ctx.shadowColor = p.ember ? "#e0283f" : "#7cc0ff";
        ctx.fill();
      });
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(raf); removeEventListener("resize", size); };
  }, []);
  return html`<canvas ref=${ref} class="absolute inset-0 w-full h-full pointer-events-none" aria-hidden="true"></canvas>`;
}

function Waves() {
  const d = "M0 60 C200 20 400 100 600 60 C800 20 1000 100 1200 60 C1400 20 1600 100 1800 60 C2000 20 2200 100 2400 60 V140 H0Z";
  const layers = [["#0f4c81", .35, 22, 0], ["#08233f", .6, 15, -6], ["#030b17", 1, 10, -12]];
  return html`<div class="absolute inset-x-0 bottom-0 h-36 overflow-hidden pointer-events-none" aria-hidden="true">
    ${layers.map(([fill, o, s, delay], i) => html`<svg key=${i} class="wave" viewBox="0 0 2400 140" preserveAspectRatio="none" style=${{ opacity: o, animationDuration: s + "s", animationDelay: delay + "s", bottom: i * -6 + "px" }}><path d=${d} fill=${fill}/></svg>`)}
  </div>`;
}

function Compass() {
  const ticks = Array.from({ length: 72 }, (_, i) => i);
  return html`<svg viewBox="0 0 400 400" class="w-full h-full drop-shadow-[0_0_40px_rgba(224,40,63,.35)]" role="img" aria-label="Decorative compass">
    <defs><radialGradient id="cg"><stop offset="0" stop-color="#0f4c81" stop-opacity=".55"/><stop offset="1" stop-color="#030b17" stop-opacity=".2"/></radialGradient></defs>
    <circle cx="200" cy="200" r="190" fill="url(#cg)" stroke="#7cc0ff" stroke-opacity=".5" stroke-width="2"/>
    <g class="spin-slow">
      <circle cx="200" cy="200" r="172" fill="none" stroke="#cfe6ff" stroke-opacity=".25" stroke-dasharray="2 8"/>
      ${ticks.map(i => html`<line key=${i} x1="200" y1="16" x2="200" y2=${i % 6 === 0 ? 34 : 24} stroke="#cfe6ff" stroke-opacity=${i % 6 === 0 ? .8 : .35} transform=${"rotate(" + i * 5 + " 200 200)"}/>`)}
    </g>
    <g class="spin-rev" opacity=".7">
      <polygon points="200,60 214,186 340,200 214,214 200,340 186,214 60,200 186,186" fill="none" stroke="#7cc0ff" stroke-width="1.500"/>
      <polygon points="200,90 208,192 310,200 208,208 200,310 192,208 90,200 192,192" fill="rgba(124,192,255,.08)" stroke="#7cc0ff" stroke-opacity=".5"/>
    </g>
    <g class="needle" style=${{ transformOrigin: "200px 200px" }}>
      <polygon points="200,48 216,200 184,200" fill="#e0283f"/>
      <polygon points="200,352 216,200 184,200" fill="#cfe6ff" fill-opacity=".85"/>
      <circle cx="200" cy="200" r="11" fill="#030b17" stroke="#e0283f" stroke-width="3"/>
    </g>
  </svg>`;
}

function Header() {
  const [open, setOpen] = useState(false);
  const [solid, setSolid] = useState(false);
  useEffect(() => { const f = () => setSolid(scrollY > 30); f(); addEventListener("scroll", f); return () => removeEventListener("scroll", f); }, []);
  return html`<header class=${"fixed top-0 inset-x-0 z-50 transition-all " + (solid || open ? "glass !border-x-0 !border-t-0" : "")} style=${{ paddingTop: "env(safe-area-inset-top, 0px)" }}>
    <div class="max-w-6xl mx-auto flex items-center justify-between px-5 py-4">
      <a href="#home" class="font-display font-extrabold text-sm sm:text-lg tracking-widest text-white">${CONFIG.creators.map(c => "@" + c.handle).join(" × ")}</a>
      <nav class="hidden md:flex gap-8">${nav.map(([l, h]) => html`<a key=${h} href=${h} class="text-sm text-foam/80 hover:text-white transition-colors">${l}</a>`)}</nav>
      <button class="md:hidden p-2 text-white" aria-label="Menu" aria-expanded=${open} onClick=${() => setOpen(!open)}>
        <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${open ? html`<path d="M6 6l12 12M18 6L6 18"/>` : html`<path d="M4 7h16M4 12h16M4 17h16"/>`}</svg>
      </button>
    </div>
    ${open && html`<nav class="md:hidden flex flex-col px-5 pb-5 gap-1">${nav.map(([l, h]) => html`<a key=${h} href=${h} onClick=${() => setOpen(false)} class="py-3 text-foam border-b border-white/10">${l}</a>`)}</nav>`}
  </header>`;
}

function Hero() {
  return html`<section id="home" class="sea relative min-h-screen flex items-center overflow-hidden pt-24 pb-40">
    <${Particles} />
    <div class="absolute -top-32 -left-32 w-[32rem] h-[32rem] rounded-full bg-crimson/20 blur-[140px]"></div>
    <div class="relative max-w-6xl mx-auto px-5 grid lg:grid-cols-[1.2fr_.8fr] gap-10 items-center w-full">
      <div>
        <div class="rise mb-6 flex flex-wrap items-center gap-3" style=${{ animationDelay: ".1s" }}>
          ${CONFIG.creators.map(c => html`<span key=${c.handle} class="inline-flex items-center gap-2 glass rounded-full px-5 py-2 font-display text-lg sm:text-2xl font-semibold tracking-wider text-white [text-shadow:0_0_22px_rgba(224,40,63,.8)]"><span class="w-2.5 h-2.5 rounded-full bg-crimson shadow-[0_0_12px_#e0283f]"></span>@${c.handle}</span>`)}
        </div>
        <h1 class="rise font-display font-extrabold text-5xl sm:text-6xl lg:text-7xl leading-[1.05] text-white" style=${{ animationDelay: ".25s" }}>WELCOME TO<br/>MY WORLD</h1>
        
        <p class="rise mt-6 max-w-lg text-lg text-foam/80 leading-relaxed" style=${{ animationDelay: ".6s" }}>${CONFIG.intro}</p>
        <div class="rise mt-9 flex flex-col sm:flex-row gap-4" style=${{ animationDelay: ".75s" }}>
          <${Button} href=${CONFIG.youtubeUrl}>Watch my videos<//>
          <${Button} href=${CONFIG.discordUrl} variant="glass">Join my Discord<//>
        </div>
      </div>
      <div class="rise mx-auto w-64 sm:w-80 lg:w-full max-w-md aspect-square" style=${{ animationDelay: ".5s" }}><${Compass} /></div>
    </div>
    <${Waves} />
  </section>`;
}

function Section({ id, title, subtitle, children, className = "" }) {
  return html`<section id=${id} class=${"relative py-24 " + className}>
    <div class="max-w-6xl mx-auto px-5">
      <h2 class="font-display font-extrabold text-3xl sm:text-4xl text-white">${title}</h2>
      ${subtitle && html`<p class="mt-3 max-w-xl text-foam/70">${subtitle}</p>`}
      <div class="mt-12">${children}</div>
    </div>
  </section>`;
}

function Avatar({ c, size = "w-32 h-32 sm:w-36 sm:h-36" }) {
  return html`<div class=${"relative shrink-0 " + size}>
    <div class="absolute -inset-2 rounded-full bg-gradient-to-tr from-crimson via-tide to-foam opacity-70 blur-lg"></div>
    <div class="relative w-full h-full rounded-full glass p-1.5">
      ${c.avatarUrl
        ? html`<img src=${c.avatarUrl} alt=${"Avatar of " + c.handle} class="w-full h-full rounded-full object-cover"/>`
        : html`<div class="w-full h-full rounded-full bg-deep flex items-center justify-center font-display text-4xl font-extrabold text-white" aria-label="Avatar placeholder">${c.channel.charAt(0)}</div>`}
    </div>
  </div>`;
}

function About() {
  return html`<${Section} id="about" title="About us" className="bg-gradient-to-b from-abyss to-deep/60">
    <div class="glass rounded-3xl p-7 sm:p-10 mb-8">
      ${CONFIG.about.map((p, i) => html`<p key=${i} class="text-lg leading-relaxed text-foam/85 mb-4 max-w-3xl">${p}</p>`)}
      <ul class="mt-6 flex flex-wrap gap-3">${CONFIG.interests.map(t => html`<li key=${t} class="rounded-full border border-crimson/40 bg-crimson/10 px-4 py-1.5 text-sm text-white">${t}</li>`)}</ul>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      ${CONFIG.creators.map(c => html`<article key=${c.handle} class="glass rounded-3xl p-7 flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
        <${Avatar} c=${c} />
        <div>
          <h3 class="font-display text-2xl font-extrabold text-white">${c.channel}</h3>
          <p class="text-crimson font-semibold">@${c.handle}</p>
          <span class="inline-block mt-2 rounded-full border border-crimson/50 bg-crimson/15 px-3 py-0.5 text-xs font-semibold uppercase tracking-widest text-white">Founder</span>
          <p class="mt-3 text-foam/80 leading-relaxed">${c.bio}</p>
        </div>
      </article>`)}
    </div>
  <//>`;
}

function ChannelCard({ c }) {
  const vids = c.videos.length ? c.videos : [{ title: "Newest video" }, { title: "Recent upload" }, { title: "More on the channel" }];
  return html`<article class="glass rounded-3xl p-6 sm:p-8 relative overflow-hidden">
    <div class="absolute -right-24 -top-24 w-72 h-72 rounded-full bg-crimson/25 blur-[110px]"></div>
    <div class="relative flex flex-col sm:flex-row sm:items-center justify-between gap-5">
      <div class="flex items-center gap-4"><${YtLogo} className="w-12 h-12" />
        <div><p class="font-display text-2xl font-extrabold text-white">${c.channel}</p><p class="text-foam/70">@${c.handle}</p></div>
      </div>
      <a href=${c.url} ...${ext} class="btn inline-flex items-center justify-center rounded-full bg-[#ff1f3d] px-7 py-3 font-semibold text-white shadow-[0_0_30px_rgba(255,31,61,.5)] hover:shadow-[0_0_50px_rgba(255,31,61,.85)]">Subscribe</a>
    </div>
    <h4 class="relative mt-8 mb-4 font-display text-lg text-white">Latest videos</h4>
    <div class="relative grid sm:grid-cols-3 gap-4">
      ${vids.map((v, i) => html`<a key=${i} href=${v.url || c.url} ...${ext} class="group block rounded-2xl overflow-hidden border border-white/10 bg-abyss/60 transition-transform hover:-translate-y-1 hover:border-crimson/60">
        <div class="aspect-video bg-gradient-to-br from-tide/70 via-deep to-abyss flex items-center justify-center">
          <div class="w-11 h-11 rounded-full bg-crimson/90 flex items-center justify-center shadow-[0_0_24px_rgba(224,40,63,.7)] transition-transform group-hover:scale-110"><svg viewBox="0 0 24 24" class="w-5 h-5 ml-0.5" fill="#fff"><path d="M7 4.500v15l13-7.500z"/></svg></div>
        </div>
        <p class="p-3 text-sm text-white font-semibold">${v.title}</p>
      </a>`)}
    </div>
  </article>`;
}

function YouTube() {
  return html`<${Section} id="youtube" title="On YouTube" subtitle="Two channels, one crew. Subscribe to both so you never miss a run.">
    <div class="grid lg:grid-cols-2 gap-6">${CONFIG.creators.map(c => html`<${ChannelCard} key=${c.handle} c=${c} />`)}</div>
  <//>`;
}

function Discord() {
  return html`<${Section} id="discord" title="Join the crew" className="overflow-hidden">
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[40rem] max-w-full h-[24rem] rounded-full bg-indigo-600/30 blur-[130px] pointer-events-none"></div>
    <div class="relative rounded-3xl p-8 sm:p-12 border border-indigo-400/30 bg-gradient-to-br from-indigo-500/15 via-violet-700/10 to-transparent backdrop-blur-xl shadow-[0_0_60px_rgba(99,102,241,.25)] grid md:grid-cols-[1.2fr_1fr] gap-10 items-center">
      <div>
        <div class="flex items-center gap-3 text-indigo-300 mb-4"><${DcIcon} className="w-9 h-9" /><span class="font-display text-xl text-white">${CONFIG.community}</span></div>
        <p class="text-lg text-foam/85 max-w-md leading-relaxed">Founded by @ZEAUXYT and @Vyroblox2. Hang out with fellow players, find teammates and be the first to know when something new drops. Everyone’s welcome aboard.</p>
        <div class="mt-8"><${Button} href=${CONFIG.discordUrl} variant="blurple">Join my server<//></div>
      </div>
      <ul class="space-y-3">${CONFIG.perks.map(p => html`<li key=${p} class="flex items-center gap-3 rounded-2xl border border-indigo-300/20 bg-white/5 px-5 py-4 text-white"><span class="w-2.5 h-2.5 rounded-full bg-violet-400 shadow-[0_0_12px_#a78bfa]"></span>${p}</li>`)}</ul>
    </div>
  <//>`;
}

function Footer() {
  return html`<footer class="relative border-t border-white/10 bg-abyss py-12 text-center">
    <svg viewBox="0 0 120 24" class="w-28 mx-auto mb-6 text-crimson" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 14c10-10 20 10 29 0s19 10 29 0 19 10 29 0 19 10 29 0"/></svg>
    <nav class="flex flex-wrap justify-center gap-x-8 gap-y-3" aria-label="Social links">
      ${CONFIG.socials.filter(l => l.url).map(l => html`<a key=${l.label} href=${l.url} ...${ext} class="text-foam/80 hover:text-white transition-colors">${l.label}</a>`)}
    </nav>
    <p class="mt-8 text-sm text-foam/50">© ${new Date().getFullYear()} ${CONFIG.community}. All rights reserved.</p>
    <p class="mt-2 text-xs text-foam/35">Fan-inspired design. Not affiliated with or endorsed by the owners of One Piece.</p>
  </footer>`;
}

function App() {
  return html`<${React.Fragment}><${Header} /><main><${Hero} /><${About} /><${YouTube} /><${Discord} /></main><${Footer} /><//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
